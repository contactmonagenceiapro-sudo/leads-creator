<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion artisan — Expertise Digitale</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121214;
            color: #e1e1e6;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .carte {
            width: 100%;
            max-width: 400px;
            background: #202024;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        h1 { color: #00b37e; font-size: 1.5em; margin-top: 0; border-bottom: 2px solid #29292e; padding-bottom: 12px; }
        p.sous-titre { color: #8d8d99; margin-top: -4px; margin-bottom: 24px; font-size: 0.9em; }
        label { display: block; font-size: 0.85em; color: #8d8d99; margin-bottom: 4px; margin-top: 16px; }
        input {
            width: 100%;
            box-sizing: border-box;
            background: #18181b;
            border: 1px solid #3f3f46;
            color: #f4f4f5;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 1em;
        }
        input:focus { outline: none; border-color: #00b37e; }
        button {
            width: 100%;
            margin-top: 24px;
            background: #00b37e;
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #00d492; }
        button:disabled { background: #3f3f46; color: #8d8d99; cursor: not-allowed; }
        .message { margin-top: 16px; padding: 10px 12px; border-radius: 6px; font-size: 0.9em; display: none; }
        .message.erreur { display: block; background: rgba(247, 90, 104, 0.15); color: #f75a68; border: 1px solid #f75a68; }
        .lien-bas { text-align: center; margin-top: 20px; font-size: 0.9em; color: #8d8d99; }
        .lien-bas a { color: #00b37e; text-decoration: none; }
        .lien-bas a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="carte">
        <h1>Connexion artisan</h1>
        <p class="sous-titre">Expertise Digitale — Espace Artisans</p>

        <form id="form-connexion" novalidate>
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="vous@entreprise.fr">

            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" required>

            <div id="message" class="message"></div>

            <button type="submit" id="bouton-connexion">Se connecter</button>
        </form>

        <div class="lien-bas">Pas encore de compte ? <a href="artisan-inscription.html">S'inscrire</a></div>
    </div>

    <script src="supabase-client.js"></script>
    <script>
        const zoneMessage = document.getElementById("message");
        const boutonConnexion = document.getElementById("bouton-connexion");

        function afficherMessage(texte, type) {
            zoneMessage.textContent = texte;
            zoneMessage.className = "message " + type;
        }

        // Déjà connecté (session encore valide) : pas la peine de repasser
        // par le formulaire, direction le tableau de bord.
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = "artisan-tableau-de-bord.html";
            }
        })();

        document.getElementById("form-connexion").addEventListener("submit", async (evenement) => {
            evenement.preventDefault();
            zoneMessage.className = "message";

            const email = document.getElementById("email").value.trim();
            const motDePasse = document.getElementById("mot_de_passe").value;

            boutonConnexion.disabled = true;
            boutonConnexion.textContent = "Connexion en cours...";

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password: motDePasse });

            boutonConnexion.disabled = false;
            boutonConnexion.textContent = "Se connecter";

            if (error) {
                afficherMessage(traduireErreurAuth(error), "erreur");
                return;
            }

            window.location.href = "artisan-tableau-de-bord.html";
        });
    </script>
</body>
</html>
