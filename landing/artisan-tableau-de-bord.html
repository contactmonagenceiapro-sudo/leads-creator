<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon espace — Expertise Digitale</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121214;
            color: #e1e1e6;
            margin: 0;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid #29292e;
        }
        header h1 { font-size: 1.2em; color: #00b37e; margin: 0; }
        button#bouton-deconnexion {
            background: transparent;
            border: 1px solid #3f3f46;
            color: #e1e1e6;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
        }
        button#bouton-deconnexion:hover { border-color: #f75a68; color: #f75a68; }
        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .carte {
            background: #202024;
            padding: 28px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .carte h2 { margin-top: 0; font-size: 1.1em; color: #f4f4f5; border-bottom: 1px solid #29292e; padding-bottom: 10px; }
        .champ { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #29292e; font-size: 0.95em; }
        .champ:last-child { border-bottom: none; }
        .champ .libelle { color: #8d8d99; }
        .champ .valeur { color: #f4f4f5; font-weight: 500; text-align: right; }
        .chargement, .erreur { color: #8d8d99; font-style: italic; text-align: center; padding: 20px; }
        .erreur { color: #f75a68; }
        .a-venir { color: #8d8d99; font-size: 0.9em; }
    </style>
</head>
<body>
    <header>
        <h1>👷 Mon espace artisan</h1>
        <button id="bouton-deconnexion">Se déconnecter</button>
    </header>

    <main>
        <div id="contenu" class="carte">
            <p class="chargement">Chargement de votre profil...</p>
        </div>

        <div class="carte">
            <h2>Vos leads / demandes de devis</h2>
            <p class="a-venir">Bientôt disponible — cette section affichera les demandes de devis reçues via votre site vitrine.</p>
        </div>
    </main>

    <script src="supabase-client.js"></script>
    <script>
        function champHtml(libelle, valeur) {
            return `<div class="champ"><span class="libelle">${libelle}</span><span class="valeur">${valeur || "—"}</span></div>`;
        }

        (async () => {
            // Barrière UX (voir supabase-client.js) : redirige si aucune session
            // active. La barrière de sécurité réelle sur les données est le RLS
            // Supabase (sql/init_artisans.sql), pas cette vérification côté client.
            const session = await exigerConnexionArtisan();
            if (!session) return;
            surveillerSessionArtisan();

            const { data: profil, error } = await supabaseClient
                .from("artisans")
                .select("*")
                .eq("id", session.user.id)
                .single();

            const contenu = document.getElementById("contenu");

            if (error) {
                contenu.innerHTML = `<p class="erreur">Impossible de charger votre profil : ${error.message}</p>`;
                return;
            }

            contenu.innerHTML =
                "<h2>Bienvenue, " + (profil.nom_complet || "") + "</h2>" +
                champHtml("Entreprise", profil.nom_entreprise) +
                champHtml("SIRET", profil.siret) +
                champHtml("Corps de métier", profil.corps_metier) +
                champHtml("E-mail", profil.email);
        })();

        document.getElementById("bouton-deconnexion").addEventListener("click", async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "artisan-connexion.html";
        });
    </script>
</body>
</html>
