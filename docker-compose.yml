services:
  api:
    container_name: ai_api
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    # Toute la racine du projet est montée (et non seulement ./api) car
    # main.py importe ceo_agent.py et lance lead_worker.py / scraper_batiment.py
    # en subprocess depuis /app : ces fichiers vivent à la racine du dépôt.
    volumes:
      - .:/app
    working_dir: /app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - ai_ollama
    restart: unless-stopped

  ai_ollama:
    container_name: ai_ollama
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  n8n:
    container_name: ai_n8n
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  ollama_data:
  n8n_data:
