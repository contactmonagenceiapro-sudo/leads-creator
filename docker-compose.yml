# Le dashboard Streamlit (dashboard/) tourne désormais sur Streamlit
# Community Cloud, pas dans ce docker-compose : il n'y a plus de backend
# FastAPI ni d'Ollama conteneurisé à faire tourner ici (voir dashboard/SECRETS.md
# pour la configuration des secrets côté Streamlit Cloud, et data_access.py /
# process_runner.py pour comment le dashboard accède à Supabase et lance les
# scripts de fond directement, sans passer par une API séparée).
#
# Ce fichier ne sert donc plus qu'à faire tourner n8n (automatisation de
# contenu, sans rapport avec la migration ci-dessus) — à nettoyer séparément
# si n8n n'est plus utilisé.

services:
  n8n:
    container_name: ai_n8n
    image: n8nio/n8n:latest
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
