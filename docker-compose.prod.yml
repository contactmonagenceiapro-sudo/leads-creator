# Override de production — s'applique EN PLUS de docker-compose.yml, jamais
# seul :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Ajoute Caddy (reverse proxy HTTPS, domaine fixe — voir Caddyfile et
# DEPLOIEMENT.md) et la config n8n propre à un accès via domaine public.
# Volontairement séparé de docker-compose.yml : ce dernier reste utilisable
# tel quel en dev local (un simple `docker compose up` n'essaiera jamais
# d'obtenir un certificat Let's Encrypt pour un domaine non configuré).

services:
  n8n:
    environment:
      # Sans ça, n8n génère ses URLs de webhook (nœuds "Webhook") avec son
      # nom d'hôte/port internes plutôt que le domaine public derrière
      # Caddy — les webhooks déclenchés par un service externe pointant sur
      # N8N_DOMAIN échoueraient sinon.
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/

  caddy:
    container_name: ai_caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
      - n8n
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
